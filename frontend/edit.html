<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StorySpark — Edit Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="logo">Story<span>Spark</span></a>
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="create.html">Create Post</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="container form-page">
    <div class="form-card">
      <p class="eyebrow">Editing</p>
      <h1>Update your post</h1>

      <div id="formStatus" class="status-message" hidden></div>
      <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <p>Loading post…</p>
      </div>

      <form id="editForm" novalidate hidden>
        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" name="title" />
          <span class="error-text" id="titleError"></span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="author">Author name *</label>
            <input type="text" id="author" name="author" />
            <span class="error-text" id="authorError"></span>
          </div>

          <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" name="category">
              <option value="">Select a category</option>
              <option value="Technology">Technology</option>
              <option value="Education">Education</option>
              <option value="Lifestyle">Lifestyle</option>
              <option value="Travel">Travel</option>
              <option value="Programming">Programming</option>
              <option value="Other">Other</option>
            </select>
            <span class="error-text" id="categoryError"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="image">Featured image URL</label>
          <input type="text" id="image" name="image" />
        </div>

        <div class="form-group">
          <label for="excerpt">Short description *</label>
          <textarea id="excerpt" name="excerpt" rows="2" maxlength="200"></textarea>
          <span class="error-text" id="excerptError"></span>
        </div>

        <div class="form-group">
          <label for="content">Full blog content *</label>
          <textarea id="content" name="content" rows="10"></textarea>
          <span class="error-text" id="contentError"></span>
        </div>

        <div class="form-actions">
          <a href="index.html" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary" id="updateBtn">Update post</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">

        <div class="footer-brand">
            <div class="logo">
                Story<span>Spark</span>
            </div>

            <p>
                Stories, ideas, and perspectives worth sharing.
            </p>
        </div>

        <div class="footer-bottom">
            <p>© 2026 StorySpark. All rights reserved.</p>
        </div>

    </div>
</footer>

  <script src="js/edit.js"></script>
</body>
</html>
